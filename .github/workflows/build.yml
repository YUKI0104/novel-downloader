name: Build macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Install Wails
      run: |
        go install github.com/wailsapp/wails/v2/cmd/wails@latest

    - name: Build App
      run: |
        wails build -platform darwin/universal

    - name: Check Build Output
      run: |
        if [ -f "build/bin/番茄猫下载器.app" ]; then
          echo "✅ Build successful!"
          ls -la build/bin/番茄猫下载器.app
          du -sh build/bin/番茄猫下载器.app
        else
          echo "❌ Build failed!"
          exit 1
        fi

    - name: Create DMG
      run: |
        # 安装 create-dmg
        brew install create-dmg

        # 创建 DMG
        create-dmg \
          --volname "番茄猫下载器" \
          --window-pos 200 120 \
          --window-size 600 300 \
          --icon-size 100 \
          --icon "番茄猫下载器.app" 175 120 \
          --hide-extension "番茄猫下载器.app" \
          build/番茄猫下载器.dmg \
          build/bin/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: 番茄猫下载器
        path: |
          build/bin/番茄猫下载器.app
          build/番茄猫下载器.dmg