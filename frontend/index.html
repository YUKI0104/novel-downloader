<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>小说下载器</title>
    <link rel="stylesheet" href="./src/style.css"/>
</head>
<body>
<div id="app">
    <header class="app-header">
        <div class="brand"><span class="brand-icon">📚</span>小说下载器</div>
        <nav class="tabs">
            <button class="tab active" data-tab="search">搜索下载</button>
            <button class="tab" data-tab="library">已下载</button>
            <button class="tab" data-tab="settings">设置</button>
        </nav>
    </header>

    <main>
        <!-- 搜索下载(默认显示排行榜,搜索后切换为结果) -->
        <section id="tab-search" class="tab-panel active">
            <div class="search-bar">
                <select id="platform" class="select">
                    <option value="fanqie" selected>番茄小说</option>
                    <option value="qimao">七猫小说</option>
                </select>
                <input id="keyword" class="input" placeholder="输入书名或关键词…"
                       autocomplete="off" spellcheck="false"/>
                <button id="btn-search" class="btn primary">搜索</button>
            </div>

            <!-- 默认视图:排行榜 -->
            <div id="rank-default">
                <div class="rank-row">
                    <button class="rank-gender rank-channel active" data-channel="hot">综合热榜</button>
                    <button class="rank-gender rank-channel hidden" data-channel="adapt">🎬 改编书单</button>
                    <button class="rank-gender rank-channel" data-channel="男频">男频</button>
                    <button class="rank-gender rank-channel" data-channel="女频">女频</button>
                    <select id="rank-type" class="select rank-type-select"></select>
                    <select id="rank-genre" class="select rank-genre-select hidden"></select>
                </div>
                <div id="rank-body">
                    <div id="rank-status" class="status"></div>
                    <ul id="rank-list" class="results"></ul>
                </div>
                <div id="adapt-body" class="hidden">
                    <div class="adapt-filters">
                        <label class="af-field"><span>改编方向</span><select id="af-direction" class="select"></select></label>
                        <label class="af-field"><span>所属频道</span><select id="af-channel" class="select"></select></label>
                        <label class="af-field"><span>作品分类</span><select id="af-category" class="select"></select></label>
                        <label class="af-field"><span>作品字数</span><select id="af-words" class="select"></select></label>
                        <label class="af-field"><span>是否完结</span><select id="af-over" class="select"></select></label>
                        <label class="af-field"><span>热门书单</span><select id="af-ranking" class="select"></select></label>
                    </div>
                    <div id="af-status" class="status"></div>
                    <ul id="af-list" class="results"></ul>
                    <div class="adapt-pager">
                        <button id="af-prev" class="btn ghost small">上一页</button>
                        <span id="af-pageinfo" class="hint"></span>
                        <button id="af-next" class="btn ghost small">下一页</button>
                    </div>
                </div>
            </div>

            <!-- 搜索结果显示(搜索后切换) -->
            <div id="search-results" class="hidden">
                <div class="search-head">
                    <span id="search-status" class="status"></span>
                    <button id="btn-back-rank" class="btn ghost small">← 返回榜单</button>
                </div>
                <ul id="results" class="results"></ul>
            </div>
        </section>

        <!-- 已下载 -->
        <section id="tab-library" class="tab-panel">
            <div class="search-bar">
                <button id="btn-refresh-lib" class="btn ghost">刷新</button>
                <button id="btn-open-dir" class="btn ghost">打开下载目录</button>
            </div>
            <ul id="lib-list" class="results"></ul>
        </section>

        <!-- 设置 -->
        <section id="tab-settings" class="tab-panel">
            <div class="settings-card">
                <label class="field">
                    <span>下载目录</span>
                    <div class="row">
                        <input id="set-dir" class="input grow" type="text"/>
                        <button id="btn-pick-dir" class="btn ghost">选择…</button>
                    </div>
                </label>
                <label class="field">
                    <span>保存格式</span>
                    <select id="set-format" class="select">
                        <option value="txt">TXT（默认）</option>
                        <option value="epub">EPUB</option>
                    </select>
                </label>
                <div class="row">
                    <button id="btn-save-settings" class="btn primary">保存设置</button>
                </div>
            </div>
        </section>
    </main>
</div>

<!-- 书籍详情弹窗 -->
<div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true">
        <button id="modal-close" class="modal-close" title="关闭">✕</button>
        <div class="modal-body">
            <div class="cover">
                <img id="m-cover" alt="封面" onerror="this.style.visibility='hidden'"/>
            </div>
            <div class="m-info">
                <div class="m-title-row">
                    <h2 id="m-title"></h2>
                    <span id="m-platform" class="chip"></span>
                </div>
                <div class="meta">
                    <span id="m-author"></span>
                    <span id="m-tags"></span>
                </div>
                <div id="m-stats" class="m-stats"></div>
                <div id="m-desc" class="desc"></div>
                <div id="m-sd-strip" class="m-sd-strip hidden">
                    <span class="sd-item">📅 <b>上架</b> <span id="sd-online">—</span></span>
                    <span class="sd-item">👥 <b>申请</b> <span id="sd-apply">—</span></span>
                    <span class="sd-item">🎬 <b>改编中</b> <span id="sd-adapting">—</span></span>
                </div>
                <div class="m-actions">
                    <button id="m-download" class="btn primary big">下载</button>
                    <div id="m-progress-wrap" class="progress-wrap hidden">
                        <div class="progress"><div id="m-progress-bar" class="progress-bar"></div></div>
                        <div id="m-progress-text" class="progress-text">准备中…</div>
                    </div>
                    <span id="m-chapters" class="hint"></span>
                </div>
                <div id="m-result" class="m-result hidden">
                    <span id="m-result-text"></span>
                    <button id="m-reveal" class="btn ghost small">在 Finder 中显示</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 删除确认弹窗 -->
<div id="confirm-backdrop" class="modal-backdrop hidden">
    <div class="confirm" role="dialog" aria-modal="true">
        <h3 id="cf-title">删除确认</h3>
        <p id="cf-text" class="cf-text"></p>
        <div class="cf-actions">
            <button id="cf-record" class="btn ghost">仅移除记录</button>
            <button id="cf-file" class="btn danger">同时删除文件</button>
            <button id="cf-cancel" class="btn ghost">取消</button>
        </div>
    </div>
</div>

<!-- 全局提示 -->
<div id="toast" class="toast hidden"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
